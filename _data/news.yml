- date: "01/2026"
  content: >
    I start as a Research Scientist Intern at
    <img src="assets/img/adobe.png" alt="Adobe logo" class="logo">
    <a href="https://research.adobe.com/">Adobe Research</a>,
    working on post-training of diffusion LLMs.

- date: "10/2025"
  content: >
    <a href="https://arxiv.org/abs/2510.08233">DMPO</a> is online!
    Check out a completely new RL paradigm that uniquely leverages
    characteristics of diffusion LLMs for effective post-training!
    Code is available <a href="https://github.com/yuchen-zhu-zyc/DMPO">here</a>.

- date: "10/2025"
  content: >
    <a href="https://arxiv.org/abs/2509.25171">TR2-D2</a> is online!
    Discover the SOTA method for finetuning MDM for bio seqs design
    with tree search + off-policy RL!

- date: "10/2025"
  content: >
    <a href="https://www.arxiv.org/abs/2510.03824">PDNS</a> is online!
    See our new upgrade of <a href="https://arxiv.org/abs/2508.10684">MDNS</a>
    with additional proximal gradient steps!

- date: "09/2025"
  content: >
